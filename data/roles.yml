nonlegendary_creature: { description: creature that is not legendary, derived: true }
legendary_noncreature_spell: { description: legendary nonland, noncreature (Mox Amber), derived: true }
commander: { description: in the command zone, derived: true }
wizard: { description: creature type Wizard, derived: true }
