fetches_forest: { description: fetchland that finds Forest, derived: true }
mv_le_1: { description: nonland with mana value 1 or less, derived: true }
mv_le_2: { description: nonland with mana value 2 or less, derived: true }
mana_cost_0_or_1: { description: "mana cost is exactly {0} or {1}", derived: true }
