# Synergy rules. Every card matching selector `a` has synergy with every card matching `b`.
# A selector is a role, a list of roles (all required), or {all:, any:, none:}.
# Role names are documented in data/roles.yml. Reasons end up in synergy_pairs.csv.

# --- spells, casting, copying -------------------------------------------------------------
- reason: copies instants/sorceries
  a: copies_spells
  b: instant_sorcery
- reason: triggers on casting an instant/sorcery
  a: cast_trigger_inst_sorc
  b: instant_sorcery
- reason: triggers on casting any noncreature spell
  a: cast_trigger_noncreature
  b: noncreature_spell
- reason: magecraft also triggers on copies
  a: magecraft
  b: copies_spells
- reason: doubles Wizard/Shaman triggers
  a: doubles_wizard_shaman_triggers
  b: wizard_shaman_trigger
- reason: doubles cast/copy-caused triggers
  a: doubles_cast_triggers
  b: { any: [cast_trigger_permanent, copies_spells] }
- reason: doubles the equipped creature's triggers
  a: doubles_equipped_triggers
  b: repeatable_trigger_creature
- reason: cheap equip on a Wizard
  a: equips_wizards_cheaply
  b: wizard
- reason: trigger doublers stack
  a: trigger_doubler
  b: trigger_doubler
- reason: coin flips -> Treasures
  a: coin_flipper
  b: coin_flip_payoff
- reason: returned spell gets recast -> more cast triggers
  a: returns_spells_to_hand
  b: recast_payoff
- reason: needs/cares about a commander
  a: commander_matters
  b: commander
- reason: cares about legendary creatures
  a: legendary_matters
  b: legendary_creature
- reason: mana for a legendary spell
  a: legendary_spell_enabler
  b: legendary_noncreature_spell
- reason: untaps a legendary permanent
  a: untaps_legendary
  b: untap_worthy_legendary
- reason: "Veil makes your spells uncounterable: Offer still gives Treasures and the spell resolves"
  a: self_counter_for_treasure
  b: uncounterable_own_spells
- reason: spell copies are free targets for Offer
  a: self_counter_for_treasure
  b: { any: [storm_payoff, copies_spells] }
- reason: "counter your own Pact: 2 Treasures, no upkeep payment"
  a: self_counter_for_treasure
  b: pact
- reason: storm count / spell chaining
  a: storm_payoff
  b: { any: [mv_le_1, free_alt_cost, net_free_spell, ritual] }
- reason: each cheap spell feeds a per-spell payoff
  a: spell_count_payoff
  b: { any: [mv_le_1, free_alt_cost, net_free_spell, storm_payoff] }
- reason: red mana doesn't empty from the pool
  a: keeps_red_mana
  b: red_mana_producer
- reason: cast sorceries at instant speed
  a: grants_flash
  b: sorcery
- reason: hasty tokens convoke
  a: convoke
  b: hasty_token_maker
- reason: win more coin flips
  a: coin_flip_improver
  b: { any: [coin_flipper, coin_flip_payoff] }
- reason: better with a Wizard
  a: wizard_matters
  b: wizard
- reason: copy a valuable trigger or activation
  a: copies_abilities
  b: { any: [cast_trigger_permanent, mana_sink] }
- reason: name sticker vowels -> red mana
  a: sticker_sheet
  b: uses_stickers

