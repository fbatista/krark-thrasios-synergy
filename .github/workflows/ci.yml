name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rspec
      - run: bin/synergy lint decks/krark-thrasios.txt
      - run: bin/synergy build decks/krark-thrasios.txt --out /tmp/out
